<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Canvas -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1A2035" />
      <stop offset="60%" stop-color="#0B0D14" />
      <stop offset="100%" stop-color="#05060A" />
    </radialGradient>

    <!-- Neon Orange-Red Gradient for Shield -->
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9E44" />
      <stop offset="35%" stop-color="#FF6B00" />
      <stop offset="75%" stop-color="#FF3800" />
      <stop offset="100%" stop-color="#D92800" />
    </linearGradient>

    <!-- Inner Shield Body Gradient -->
    <linearGradient id="shieldCore" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#1E2538" />
      <stop offset="50%" stop-color="#121724" />
      <stop offset="100%" stop-color="#0A0D15" />
    </linearGradient>

    <!-- Holographic Lock Shackle Gradient -->
    <linearGradient id="shackleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA857" />
      <stop offset="100%" stop-color="#FF6B00" />
    </linearGradient>

    <!-- Core Golden Keyhole Glow -->
    <radialGradient id="keyholeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE0B2" />
      <stop offset="50%" stop-color="#FFA14A" />
      <stop offset="100%" stop-color="#FF5500" />
    </radialGradient>

    <!-- Ambient Outer Glow Filter -->
    <filter id="outerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="intenseGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24" result="blur2" />
      <feComposite in="SourceGraphic" in2="blur2" operator="over" />
    </filter>
  </defs>

  <!-- Deep Obsidian App Icon Base with Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)" />
  <rect width="510" height="510" x="1" y="1" rx="111" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" />

  <!-- Ambient Radiant Back-Orb -->
  <circle cx="256" cy="256" r="180" fill="#FF6B00" opacity="0.18" filter="url(#intenseGlow)" />

  <!-- Cybernetic Grid / Circuit Trace Accents -->
  <path d="M70 256 H120 L140 276" stroke="rgba(255,107,0,0.25)" stroke-width="3" stroke-linecap="round" fill="none" />
  <circle cx="70" cy="256" r="4" fill="#FF6B00" opacity="0.4" />

  <path d="M442 256 H392 L372 236" stroke="rgba(255,107,0,0.25)" stroke-width="3" stroke-linecap="round" fill="none" />
  <circle cx="442" cy="256" r="4" fill="#FF6B00" opacity="0.4" />

  <path d="M256 60 V100" stroke="rgba(255,107,0,0.3)" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 6" />

  <!-- Holographic Unlocked Safety Shackle (Top Padlock Arch) -->
  <path d="M194 220 V156 C194 121.75 221.75 94 256 94 C290.25 94 318 121.75 318 156 V185" 
        stroke="url(#shackleGrad)" stroke-width="28" stroke-linecap="round" fill="none" filter="url(#outerGlow)" />

  <!-- Main Cyber-Shield Armor Body -->
  <g filter="url(#outerGlow)">
    <path d="M148 210 C210 188 256 182 256 182 C256 182 302 188 364 210 C364 210 376 330 256 426 C136 330 148 210 148 210 Z" 
          fill="url(#shieldCore)" stroke="url(#shieldBorder)" stroke-width="14" stroke-linejoin="round" />
  </g>

  <!-- Inner Geometric Bevel Edge -->
  <path d="M172 226 C218 208 256 204 256 204 C256 204 294 208 340 226 C340 226 350 318 256 398 C162 318 172 226 172 226 Z" 
        fill="none" stroke="rgba(255,255,255,0.09)" stroke-width="3" />

  <!-- Center Hexagonal Radar Matrix Motif -->
  <polygon points="256,238 296,261 296,307 256,330 216,307 216,261" 
           fill="rgba(255,107,0,0.08)" stroke="rgba(255,161,74,0.3)" stroke-width="2.5" />

  <!-- Central Glowing Keyhole & AI Scanner Core -->
  <circle cx="256" cy="275" r="22" fill="url(#keyholeGlow)" filter="url(#outerGlow)" />
  <polygon points="248,275 264,275 270,320 242,320" fill="url(#keyholeGlow)" filter="url(#outerGlow)" />

  <!-- Central AI Micro-Text Crest -->
  <text x="256" y="365" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#FFA14A" text-anchor="middle" letter-spacing="4">SCAMSUNO</text>
  <text x="256" y="388" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="rgba(255,255,255,0.5)" text-anchor="middle" letter-spacing="2">AI GUARD</text>
</svg>